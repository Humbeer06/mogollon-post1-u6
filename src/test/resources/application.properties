spring.application.name=pedidos-service

# H2 embebido
spring.datasource.url=jdbc:h2:mem:pedidos_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always

server.port=8080

# Copia de la configuracion principal para pruebas: este archivo reemplaza
# por completo al de src/main/resources en el classpath de test.
# Black Friday desactivada para que cada descuento mida su propio porcentaje;
# la prueba de Black Friday la reactiva con @TestPropertySource.
promo.black-friday.activa=false
